<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" role="img" aria-label="Four bars of increasing length labelled maths, code, tool use and research.">
  <style>
    text { font-family: Inter, system-ui, sans-serif; fill: #3c3f47; }
    .label { font-size: 13px; }
    .note { font-size: 11px; fill: #82858e; }
    .bar { fill: #d9dbe1; }
    .bar-empty { fill: none; stroke: #c8cad0; stroke-width: 1; stroke-dasharray: 4 4; }
  </style>
  <text class="note" x="0" y="12">BAR LENGTH: PROCESS DATA ALREADY WRITTEN DOWN</text>
  <text class="label" x="0" y="47">Maths</text>
  <rect class="bar" x="96" y="35" width="360" height="16" rx="3" />
  <text class="label" x="0" y="80">Code</text>
  <rect class="bar" x="96" y="68" width="300" height="16" rx="3" />
  <text class="label" x="0" y="113">Tool use</text>
  <rect class="bar" x="96" y="101" width="180" height="16" rx="3" />
  <text class="label" x="0" y="146">Research</text>
  <rect class="bar-empty" x="96.5" y="134.5" width="60" height="15" rx="3" />
  <text class="note" x="168" y="146">almost nothing public</text>
</svg>
