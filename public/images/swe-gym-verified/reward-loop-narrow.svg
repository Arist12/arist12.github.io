<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290" role="img" aria-label="How a task rewards a patch. The agent reads a GitHub issue and writes a patch. Hidden tests, taken from the pull request that originally fixed the issue, run on the patch. If all pass the reward is 1, otherwise 0.">
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3c3f47; }
    .title { font-size: 15px; font-weight: 650; fill: #25262a; }
    .sub { font-size: 13px; fill: #74767e; }
    .lab { font-size: 14px; }
    .val { font-size: 14px; font-weight: 650; fill: #25262a; }
    .big { font-size: 17px; font-weight: 650; fill: #25262a; }
    .tick { font-size: 12.5px; fill: #74767e; }
    .in { font-size: 13px; font-weight: 650; fill: #ffffff; }
    .ind { font-size: 13px; font-weight: 650; fill: #25262a; }
    .grid { stroke: #e6e6e9; stroke-width: 1; }
    .axis { stroke: #c8cad0; stroke-width: 1; }
    .halo { paint-order: stroke; stroke: #fcfcfc; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <rect x="40" y="4" width="300" height="51" rx="8" fill="none" stroke="#c8cad0" stroke-width="1.2" />
  <text class="val" x="56.0" y="27.0">GitHub issue</text>
  <text class="sub" x="56.0" y="46.0">the agent reads it</text>
  <line class="axis" x1="190.0" y1="59.0" x2="190.0" y2="79.0" style="stroke:#8b8e97;stroke-width:1.4" /><path d="M186.0,73 L190.0,79 L194.0,73" fill="none" stroke="#8b8e97" stroke-width="1.4" />
  <rect x="40" y="83" width="300" height="51" rx="8" fill="none" stroke="#c8cad0" stroke-width="1.2" />
  <text class="val" x="56.0" y="106.0">Patch</text>
  <text class="sub" x="56.0" y="125.0">the agent writes it</text>
  <line class="axis" x1="190.0" y1="138.0" x2="190.0" y2="158.0" style="stroke:#8b8e97;stroke-width:1.4" /><path d="M186.0,152 L190.0,158 L194.0,152" fill="none" stroke="#8b8e97" stroke-width="1.4" />
  <rect x="40" y="162" width="300" height="68" rx="8" fill="#f6f6f8" stroke="#c8cad0" stroke-width="1.2" />
  <text class="val" x="56.0" y="185.0">Hidden tests</text>
  <text class="sub" x="56.0" y="204.0">from the original pull request; the</text>
  <text class="sub" x="56.0" y="221.0">agent never sees them</text>
  <line class="axis" x1="190.0" y1="234.0" x2="190.0" y2="254.0" style="stroke:#8b8e97;stroke-width:1.4" /><path d="M186.0,248 L190.0,254 L194.0,248" fill="none" stroke="#8b8e97" stroke-width="1.4" />
  <rect x="66" y="258" width="116" height="26" rx="13" fill="#0ca30c" /><text class="in" x="124.0" y="275.5" text-anchor="middle">pass: reward 1</text>
  <rect x="198" y="258" width="116" height="26" rx="13" fill="#e3e4e8" /><text class="ind" x="256.0" y="275.5" text-anchor="middle">fail: reward 0</text>
</svg>
