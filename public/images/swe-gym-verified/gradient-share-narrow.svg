<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 303" role="img" aria-label="Two stacked bars for the original training set. Of its 512 tasks, 11.1% are flawed and never solved and 16.6% flawed and sometimes solved. Of its 2,365 groups that carry gradient, 0.9% fall on the never-solved flawed tasks and 19.5% on the sometimes-solved flawed tasks.">
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3c3f47; }
    .title { font-size: 15px; font-weight: 650; fill: #25262a; }
    .sub { font-size: 13px; fill: #74767e; }
    .lab { font-size: 14px; }
    .val { font-size: 14px; font-weight: 650; fill: #25262a; }
    .big { font-size: 17px; font-weight: 650; fill: #25262a; }
    .tick { font-size: 12.5px; fill: #74767e; }
    .in { font-size: 13px; font-weight: 650; fill: #ffffff; }
    .ind { font-size: 13px; font-weight: 650; fill: #25262a; }
    .grid { stroke: #e6e6e9; stroke-width: 1; }
    .axis { stroke: #c8cad0; stroke-width: 1; }
    .halo { paint-order: stroke; stroke: #fcfcfc; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <rect x="0" y="4" width="12" height="12" rx="3" fill="#8b8e97" />
  <text class="lab" x="20.0" y="15.0">mislabelled and never solved: a pass-rate</text>
  <text class="lab" x="20.0" y="33.0">filter removes these</text>
  <rect x="0" y="46" width="12" height="12" rx="3" fill="#d03b3b" />
  <text class="lab" x="20.0" y="57.0">mislabelled and sometimes solved: the filter</text>
  <text class="lab" x="20.0" y="75.0">keeps these</text>
  <rect x="0" y="88" width="12" height="12" rx="3" fill="#e3e4e8" />
  <text class="lab" x="20.0" y="99.0">other tasks</text>
  <text class="title" x="0.0" y="145.0">Share of the 512 tasks</text>
  <rect x="0.0" y="157" width="40.3" height="24" rx="3" fill="#8b8e97" />
  <line class="axis" x1="20.2" y1="183.0" x2="20.2" y2="190.0" />
  <text class="val" x="16.2" y="204.0">11.1%</text>
  <rect x="42.3" y="157" width="61.1" height="24" rx="3" fill="#d03b3b" />
  <text class="in" x="50.3" y="173.5">16.6%</text>
  <rect x="105.4" y="157" width="274.6" height="24" rx="3" fill="#e3e4e8" />
  <text class="ind" x="113.4" y="173.5">72.3%</text>
  <text class="title" x="0.0" y="239.0">Share of the 2,365 groups that carry gradient</text>
  <rect x="0.0" y="251" width="1.5" height="24" rx="3" fill="#8b8e97" />
  <line class="axis" x1="0.7" y1="277.0" x2="0.7" y2="284.0" />
  <text class="val" x="0.0" y="298.0">0.9%</text>
  <rect x="3.4" y="251" width="72.1" height="24" rx="3" fill="#d03b3b" />
  <text class="in" x="11.4" y="267.5">19.5%</text>
  <rect x="77.4" y="251" width="302.6" height="24" rx="3" fill="#e3e4e8" />
  <text class="ind" x="85.4" y="267.5">79.6%</text>
</svg>
