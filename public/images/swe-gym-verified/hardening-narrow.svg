<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 350" role="img" aria-label="Training reward on the 143 tasks that got new tests, in four 20-step bins, mean of two paired runs. Clean, graded by its original tests, rises from 71% to 79%. The model trained with the new tests rises from 59% to 65%. Clean's own patches re-graded with the new tests run from 59% to 62%, about one point below it on average.">
  <style>
    @font-face { font-family: "Fig Inter"; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "Fig Inter"; font-weight: 650; src: url(data:font/woff2;base64,) format("woff2"); }
    text { font-family: "Fig Inter", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3c3f47; }
    .title { font-size: 15px; font-weight: 650; fill: #25262a; }
    .sub { font-size: 13px; fill: #74767e; }
    .lab { font-size: 14px; }
    .val { font-size: 14px; font-weight: 650; fill: #25262a; }
    .big { font-size: 17px; font-weight: 650; fill: #25262a; }
    .tick { font-size: 12.5px; fill: #74767e; }
    .in { font-size: 13px; font-weight: 650; fill: #ffffff; }
    .ind { font-size: 13px; font-weight: 650; fill: #25262a; }
    .grid { stroke: #e6e6e9; stroke-width: 1; }
    .axis { stroke: #c8cad0; stroke-width: 1; }
    .halo { paint-order: stroke; stroke: #fcfcfc; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <line class="grid" x1="0.0" y1="11.0" x2="22.0" y2="11.0" style="stroke:#2a78d6;stroke-width:2.5;stroke-linecap:round;" />
  <text class="lab" x="30.0" y="16.0">Clean, graded by its original tests</text>
  <line class="grid" x1="0.0" y1="33.0" x2="22.0" y2="33.0" style="stroke:#1e9886;stroke-width:2.5;stroke-linecap:round;" />
  <text class="lab" x="30.0" y="38.0">Hardened, trained with the new tests</text>
  <line class="grid" x1="0.0" y1="55.0" x2="22.0" y2="55.0" style="stroke:#2a78d6;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:2 6" />
  <text class="lab" x="30.0" y="60.0">Clean's patches, re-graded with the new tests</text>
  <text class="sub" x="2.0" y="84.0">training reward on the 143 hardened tasks</text>
  <line class="grid" x1="40.0" y1="300.0" x2="372.0" y2="300.0" />
  <text class="tick" x="34.0" y="304.0" text-anchor="end">50%</text>
  <line class="grid" x1="40.0" y1="271.4" x2="372.0" y2="271.4" />
  <line class="grid" x1="40.0" y1="242.9" x2="372.0" y2="242.9" />
  <text class="tick" x="34.0" y="246.9" text-anchor="end">60%</text>
  <line class="grid" x1="40.0" y1="214.3" x2="372.0" y2="214.3" />
  <line class="grid" x1="40.0" y1="185.7" x2="372.0" y2="185.7" />
  <text class="tick" x="34.0" y="189.7" text-anchor="end">70%</text>
  <line class="grid" x1="40.0" y1="157.1" x2="372.0" y2="157.1" />
  <line class="grid" x1="40.0" y1="128.6" x2="372.0" y2="128.6" />
  <text class="tick" x="34.0" y="132.6" text-anchor="end">80%</text>
  <line class="grid" x1="40.0" y1="100.0" x2="372.0" y2="100.0" />
  <text class="tick" x="76.0" y="318.0" text-anchor="middle">1–20</text>
  <text class="tick" x="162.7" y="318.0" text-anchor="middle">21–40</text>
  <text class="tick" x="249.3" y="318.0" text-anchor="middle">41–60</text>
  <text class="tick" x="336.0" y="318.0" text-anchor="middle">61–80</text>
  <text class="sub" x="206.0" y="340.0" text-anchor="middle">training steps</text>
  <polyline points="76.0,177.4 162.7,164.9 249.3,131.7 336.0,134.9" fill="none" stroke="#2a78d6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="" />
  <circle cx="336.0" cy="134.9" r="4.5" fill="#2a78d6" stroke="#fcfcfc" stroke-width="2" />
  <polyline points="76.0,248.9 162.7,222.0 249.3,217.7 336.0,213.7" fill="none" stroke="#1e9886" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="" />
  <circle cx="336.0" cy="213.7" r="4.5" fill="#1e9886" stroke="#fcfcfc" stroke-width="2" />
  <polyline points="76.0,249.1 162.7,239.1 249.3,204.9 336.0,232.6" fill="none" stroke="#2a78d6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="stroke-dasharray:2 6" />
  <circle cx="336.0" cy="232.6" r="4.5" fill="#2a78d6" stroke="#fcfcfc" stroke-width="2" />
  <line class="axis" x1="96.0" y1="186.4" x2="96.0" y2="236.9" style="stroke:#3c3f47;stroke-width:1.2" />
  <path d="M92.0,191.42857142857142 L96.0,186.42857142857142 L100.0,191.42857142857142" fill="none" stroke="#3c3f47" stroke-width="1.2" />
  <path d="M92.0,231.85714285714283 L96.0,236.85714285714283 L100.0,231.85714285714283" fill="none" stroke="#3c3f47" stroke-width="1.2" />
  <text class="val halo" x="106.0" y="210.6">13 points</text>
  <text class="sub" x="206.0" y="287.4" text-anchor="middle">Hardened: 1 point above the dotted line</text>
</svg>
