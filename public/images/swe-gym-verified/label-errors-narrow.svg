<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 318" role="img" aria-label="A two-by-two table of patch against reward. A correct fix with reward 1 and a wrong patch with reward 0 are labelled correctly. A correct fix with reward 0 is a false negative: 55% of the audited tasks have a test that does this. A wrong patch with reward 1 is a false positive: 26% of the passing patches.">
  <style>
    @font-face { font-family: "Fig Inter"; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "Fig Inter"; font-weight: 650; src: url(data:font/woff2;base64,) format("woff2"); }
    text { font-family: "Fig Inter", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3c3f47; }
    .title { font-size: 15px; font-weight: 650; fill: #25262a; }
    .sub { font-size: 13px; fill: #74767e; }
    .lab { font-size: 14px; }
    .val { font-size: 14px; font-weight: 650; fill: #25262a; }
    .big { font-size: 17px; font-weight: 650; fill: #25262a; }
    .tick { font-size: 12.5px; fill: #74767e; }
    .in { font-size: 13px; font-weight: 650; fill: #ffffff; }
    .ind { font-size: 13px; font-weight: 650; fill: #25262a; }
    .grid { stroke: #e6e6e9; stroke-width: 1; }
    .axis { stroke: #c8cad0; stroke-width: 1; }
    .halo { paint-order: stroke; stroke: #fcfcfc; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <text class="val" x="162.0" y="16.0" text-anchor="middle">tests pass</text>
  <text class="sub" x="162.0" y="34.0" text-anchor="middle">reward 1</text>
  <text class="val" x="310.0" y="16.0" text-anchor="middle">tests fail</text>
  <text class="sub" x="310.0" y="34.0" text-anchor="middle">reward 0</text>
  <text class="val" x="0.0" y="108.5">the patch</text>
  <text class="val" x="0.0" y="126.5">is correct</text>
  <rect x="92.0" y="48" width="140.0" height="129" rx="8" fill="#f3f4f6" />
  <text class="sub" x="162.0" y="117.5" text-anchor="middle">labelled correctly</text>
  <rect x="240.0" y="48" width="140.0" height="129" rx="8" fill="#fbe9e9" />
  <text class="val" x="254.0" y="73.0" style="fill:#d03b3b">false negative</text>
  <text class="lab" x="254.0" y="94.0">a correct fix is</text>
  <text class="lab" x="254.0" y="112.0">rejected</text>
  <text class="sub" x="254.0" y="131.0">55% of the tasks</text>
  <text class="sub" x="254.0" y="148.0">we judged have</text>
  <text class="sub" x="254.0" y="165.0">such a test</text>
  <text class="val" x="0.0" y="245.5">the patch</text>
  <text class="val" x="0.0" y="263.5">is wrong</text>
  <rect x="92.0" y="185" width="140.0" height="129" rx="8" fill="#fbe9e9" />
  <text class="val" x="106.0" y="210.0" style="fill:#d03b3b">false positive</text>
  <text class="lab" x="106.0" y="231.0">a wrong patch</text>
  <text class="lab" x="106.0" y="249.0">is accepted</text>
  <text class="sub" x="106.0" y="268.0">26% of passing</text>
  <text class="sub" x="106.0" y="285.0">patches</text>
  <rect x="240.0" y="185" width="140.0" height="129" rx="8" fill="#f3f4f6" />
  <text class="sub" x="310.0" y="254.5" text-anchor="middle">labelled correctly</text>
</svg>
