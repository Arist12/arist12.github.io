<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 270" role="img" aria-label="A two-by-two table of patch against reward. A correct fix with reward 1 and a wrong patch with reward 0 are labelled correctly. A correct fix with reward 0 is a false negative: 55% of the audited tasks have a test that does this. A wrong patch with reward 1 is a false positive: 26% of the passing patches.">
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3c3f47; }
    .title { font-size: 15px; font-weight: 650; fill: #25262a; }
    .sub { font-size: 13px; fill: #74767e; }
    .lab { font-size: 14px; }
    .val { font-size: 14px; font-weight: 650; fill: #25262a; }
    .big { font-size: 17px; font-weight: 650; fill: #25262a; }
    .tick { font-size: 12.5px; fill: #74767e; }
    .in { font-size: 13px; font-weight: 650; fill: #ffffff; }
    .ind { font-size: 13px; font-weight: 650; fill: #25262a; }
    .grid { stroke: #e6e6e9; stroke-width: 1; }
    .axis { stroke: #c8cad0; stroke-width: 1; }
    .halo { paint-order: stroke; stroke: #fcfcfc; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <text class="val" x="162.0" y="18.0" text-anchor="middle">tests pass: reward 1</text>
  <text class="val" x="310.0" y="18.0" text-anchor="middle">tests fail: reward 0</text>
  <text class="val" x="0.0" y="86.0">the patch</text>
  <text class="val" x="0.0" y="104.0">is correct</text>
  <rect x="92.0" y="34" width="140.0" height="112" rx="8" fill="#f3f4f6" />
  <text class="sub" x="162.0" y="95.0" text-anchor="middle">labelled correctly</text>
  <rect x="240.0" y="34" width="140.0" height="112" rx="8" fill="#fbe9e9" />
  <text class="val" x="254.0" y="59" style="fill:#d03b3b">false negative</text>
  <text class="lab" x="254.0" y="79.0">a correct fix is</text>
  <text class="lab" x="254.0" y="96.0">rejected</text>
  <text class="sub" x="254.0" y="115.0">55% of tasks</text>
  <text class="val" x="0.0" y="206.0">the patch</text>
  <text class="val" x="0.0" y="224.0">is wrong</text>
  <rect x="92.0" y="154" width="140.0" height="112" rx="8" fill="#fbe9e9" />
  <text class="val" x="106.0" y="179" style="fill:#d03b3b">false positive</text>
  <text class="lab" x="106.0" y="199.0">a wrong patch is</text>
  <text class="lab" x="106.0" y="216.0">accepted</text>
  <text class="sub" x="106.0" y="235.0">26% of passing</text>
  <text class="sub" x="106.0" y="251.0">patches</text>
  <rect x="240.0" y="154" width="140.0" height="112" rx="8" fill="#f3f4f6" />
  <text class="sub" x="310.0" y="215.0" text-anchor="middle">labelled correctly</text>
</svg>
