<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-label="Gain in pass@1 over the base model for three training sets, three runs each. Means on SWE-bench Verified: Orig +3.0, Orig+Filter +4.1, Clean +5.4 points. Means on SWE-bench Pro: Orig −0.2, Orig+Filter −2.4, Clean +2.5 points.">
  <style>
