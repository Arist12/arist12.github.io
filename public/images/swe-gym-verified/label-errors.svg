<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 222" role="img" aria-label="A two-by-two table of patch against reward. A correct fix with reward 1 and a wrong patch with reward 0 are labelled correctly. A correct fix with reward 0 is a false negative: 55% of the audited tasks have a test that does this. A wrong patch with reward 1 is a false positive: 26% of the passing patches.">
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3c3f47; }
    .title { font-size: 15px; font-weight: 650; fill: #25262a; }
    .sub { font-size: 13px; fill: #74767e; }
    .lab { font-size: 14px; }
    .val { font-size: 14px; font-weight: 650; fill: #25262a; }
    .big { font-size: 17px; font-weight: 650; fill: #25262a; }
    .tick { font-size: 12.5px; fill: #74767e; }
    .in { font-size: 13px; font-weight: 650; fill: #ffffff; }
    .ind { font-size: 13px; font-weight: 650; fill: #25262a; }
    .grid { stroke: #e6e6e9; stroke-width: 1; }
    .axis { stroke: #c8cad0; stroke-width: 1; }
    .halo { paint-order: stroke; stroke: #fcfcfc; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <text class="val" x="270.5" y="18.0" text-anchor="middle">tests pass: reward 1</text>
  <text class="val" x="519.5" y="18.0" text-anchor="middle">tests fail: reward 0</text>
  <text class="val" x="0.0" y="74.0">the patch</text>
  <text class="val" x="0.0" y="92.0">is correct</text>
  <rect x="150.0" y="34" width="241.0" height="88" rx="8" fill="#f3f4f6" />
  <text class="sub" x="270.5" y="83.0" text-anchor="middle">labelled correctly</text>
  <rect x="399.0" y="34" width="241.0" height="88" rx="8" fill="#fbe9e9" />
  <text class="val" x="413.0" y="59" style="fill:#d03b3b">false negative</text>
  <text class="lab" x="413.0" y="79.0">a correct fix is rejected</text>
  <text class="sub" x="413.0" y="98.0">55% of tasks have a test that does this</text>
  <text class="val" x="0.0" y="170.0">the patch</text>
  <text class="val" x="0.0" y="188.0">is wrong</text>
  <rect x="150.0" y="130" width="241.0" height="88" rx="8" fill="#fbe9e9" />
  <text class="val" x="164.0" y="155" style="fill:#d03b3b">false positive</text>
  <text class="lab" x="164.0" y="175.0">a wrong patch is accepted</text>
  <text class="sub" x="164.0" y="194.0">26% of passing patches</text>
  <rect x="399.0" y="130" width="241.0" height="88" rx="8" fill="#f3f4f6" />
  <text class="sub" x="519.5" y="179.0" text-anchor="middle">labelled correctly</text>
</svg>
