<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 350" role="img" aria-label="Pass@1 on the 100-task development split at training steps 10 to 80, mean of three runs. The three sets stay close through step 40. At step 80 Clean is at 53.0%, Orig+Filter at 49.3% and Orig at 48.0%; the base model is at 46.8%.">
