  <text class="tick" x="38.0" y="250.0" text-anchor="end">44%</text>
  <line class="grid" x1="44.0" y1="210.0" x2="474.0" y2="210.0" />
  <text class="tick" x="38.0" y="214.0" text-anchor="end">46%</text>
  <line class="grid" x1="44.0" y1="174.0" x2="474.0" y2="174.0" />
  <text class="tick" x="38.0" y="178.0" text-anchor="end">48%</text>
