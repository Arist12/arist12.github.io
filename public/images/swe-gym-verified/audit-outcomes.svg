<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 162" role="img" aria-label="Of the 2,263 tasks whose audit finished, 1,176 are removed, 903 are released unchanged and 184 are released with a repaired issue. The 1,087 released tasks form SWE-Gym-Verified.">
  <style>
    @font-face { font-family: "Fig Inter"; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "Fig Inter"; font-weight: 650; src: url(data:font/woff2;base64,) format("woff2"); }
    text { font-family: "Fig Inter", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3c3f47; }
    .title { font-size: 15px; font-weight: 650; fill: #25262a; }
