<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" role="img" aria-label="Training reward on the 143 hardened tasks in four 20-step bins. Clean, graded by its original tests, rises from 72% to 79%. Clean+FP, trained with the new tests, rises from 58% to 66%. Clean's own patches re-graded with the new tests run from 59% to 62%, close to Clean+FP.">
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3c3f47; }
    .title { font-size: 15px; font-weight: 650; fill: #25262a; }
    .sub { font-size: 13px; fill: #74767e; }
    .lab { font-size: 14px; }
    .val { font-size: 14px; font-weight: 650; fill: #25262a; }
    .big { font-size: 17px; font-weight: 650; fill: #25262a; }
    .tick { font-size: 12.5px; fill: #74767e; }
    .in { font-size: 13px; font-weight: 650; fill: #ffffff; }
    .ind { font-size: 13px; font-weight: 650; fill: #25262a; }
    .grid { stroke: #e6e6e9; stroke-width: 1; }
    .axis { stroke: #c8cad0; stroke-width: 1; }
    .halo { paint-order: stroke; stroke: #fcfcfc; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <line class="grid" x1="44.0" y1="236.0" x2="410.0" y2="236.0" />
  <text class="tick" x="38.0" y="240.0" text-anchor="end">50%</text>
  <line class="grid" x1="44.0" y1="204.6" x2="410.0" y2="204.6" />
  <line class="grid" x1="44.0" y1="173.1" x2="410.0" y2="173.1" />
  <text class="tick" x="38.0" y="177.1" text-anchor="end">60%</text>
  <line class="grid" x1="44.0" y1="141.7" x2="410.0" y2="141.7" />
  <line class="grid" x1="44.0" y1="110.3" x2="410.0" y2="110.3" />
  <text class="tick" x="38.0" y="114.3" text-anchor="end">70%</text>
  <line class="grid" x1="44.0" y1="78.9" x2="410.0" y2="78.9" />
  <line class="grid" x1="44.0" y1="47.4" x2="410.0" y2="47.4" />
  <text class="tick" x="38.0" y="51.4" text-anchor="end">80%</text>
  <line class="grid" x1="44.0" y1="16.0" x2="410.0" y2="16.0" />
  <text class="tick" x="80.0" y="254.0" text-anchor="middle">1–20</text>
  <text class="tick" x="178.0" y="254.0" text-anchor="middle">21–40</text>
  <text class="tick" x="276.0" y="254.0" text-anchor="middle">41–60</text>
  <text class="tick" x="374.0" y="254.0" text-anchor="middle">61–80</text>
  <text class="sub" x="227.0" y="276.0" text-anchor="middle">training steps</text>
  <polyline points="80.0,100.2 178.0,91.8 276.0,52.2 374.0,55.6" fill="none" stroke="#2a78d6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="" />
  <circle cx="374.0" cy="55.6" r="4.5" fill="#2a78d6" stroke="#fcfcfc" stroke-width="2" />
  <polyline points="80.0,185.5 178.0,162.9 276.0,141.9 374.0,134.4" fill="none" stroke="#eda100" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="" />
  <circle cx="374.0" cy="134.4" r="4.5" fill="#eda100" stroke="#fcfcfc" stroke-width="2" />
  <polyline points="80.0,180.1 178.0,169.1 276.0,131.3 374.0,161.8" fill="none" stroke="#2a78d6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="stroke-dasharray:2 6" />
  <circle cx="374.0" cy="161.8" r="4.5" fill="#2a78d6" stroke="#fcfcfc" stroke-width="2" />
  <line class="axis" x1="106.0" y1="109.2" x2="106.0" y2="173.5" style="stroke:#3c3f47;stroke-width:1.2" />
  <path d="M102.0,114.22857142857137 L106.0,109.22857142857137 L110.0,114.22857142857137" fill="none" stroke="#3c3f47" stroke-width="1.2" />
  <path d="M102.0,168.50476190476192 L106.0,173.50476190476192 L110.0,168.50476190476192" fill="none" stroke="#3c3f47" stroke-width="1.2" />
  <text class="val halo" x="116.0" y="146.4">about 13 points</text>
