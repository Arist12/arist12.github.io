<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Training reward on the 143 tasks that got new tests, in four 20-step bins, mean of two paired runs. Clean, graded by its original tests, rises from 71% to 79%. The model trained with the new tests rises from 59% to 65%. Clean's own patches re-graded with the new tests run from 59% to 62%, about one point below it on average.">
  <style>
    @font-face { font-family: "Fig Inter"; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "Fig Inter"; font-weight: 650; src: url(data:font/woff2;base64,) format("woff2"); }
    text { font-family: "Fig Inter", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3c3f47; }
    .title { font-size: 15px; font-weight: 650; fill: #25262a; }
    .sub { font-size: 13px; fill: #74767e; }
    .lab { font-size: 14px; }
    .val { font-size: 14px; font-weight: 650; fill: #25262a; }
    .big { font-size: 17px; font-weight: 650; fill: #25262a; }
    .tick { font-size: 12.5px; fill: #74767e; }
    .in { font-size: 13px; font-weight: 650; fill: #ffffff; }
    .ind { font-size: 13px; font-weight: 650; fill: #25262a; }
    .grid { stroke: #e6e6e9; stroke-width: 1; }
    .axis { stroke: #c8cad0; stroke-width: 1; }
    .halo { paint-order: stroke; stroke: #fcfcfc; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <text class="sub" x="2.0" y="12.0">training reward on the 143 hardened tasks</text>
  <line class="grid" x1="44.0" y1="250.0" x2="410.0" y2="250.0" />
  <text class="tick" x="38.0" y="254.0" text-anchor="end">50%</text>
  <line class="grid" x1="44.0" y1="218.6" x2="410.0" y2="218.6" />
  <line class="grid" x1="44.0" y1="187.1" x2="410.0" y2="187.1" />
  <text class="tick" x="38.0" y="191.1" text-anchor="end">60%</text>
  <line class="grid" x1="44.0" y1="155.7" x2="410.0" y2="155.7" />
  <line class="grid" x1="44.0" y1="124.3" x2="410.0" y2="124.3" />
  <text class="tick" x="38.0" y="128.3" text-anchor="end">70%</text>
  <line class="grid" x1="44.0" y1="92.9" x2="410.0" y2="92.9" />
  <line class="grid" x1="44.0" y1="61.4" x2="410.0" y2="61.4" />
  <text class="tick" x="38.0" y="65.4" text-anchor="end">80%</text>
  <line class="grid" x1="44.0" y1="30.0" x2="410.0" y2="30.0" />
  <text class="tick" x="80.0" y="268.0" text-anchor="middle">1–20</text>
  <text class="tick" x="178.0" y="268.0" text-anchor="middle">21–40</text>
  <text class="tick" x="276.0" y="268.0" text-anchor="middle">41–60</text>
  <text class="tick" x="374.0" y="268.0" text-anchor="middle">61–80</text>
  <text class="sub" x="227.0" y="290.0" text-anchor="middle">training steps</text>
  <polyline points="80.0,115.2 178.0,101.3 276.0,64.9 374.0,68.3" fill="none" stroke="#2a78d6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="" />
  <circle cx="374.0" cy="68.3" r="4.5" fill="#2a78d6" stroke="#fcfcfc" stroke-width="2" />
  <polyline points="80.0,193.7 178.0,164.2 276.0,159.5 374.0,155.1" fill="none" stroke="#eda100" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="" />
  <circle cx="374.0" cy="155.1" r="4.5" fill="#eda100" stroke="#fcfcfc" stroke-width="2" />
  <polyline points="80.0,194.1 178.0,183.1 276.0,145.3 374.0,175.8" fill="none" stroke="#2a78d6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="stroke-dasharray:2 6" />
  <circle cx="374.0" cy="175.8" r="4.5" fill="#2a78d6" stroke="#fcfcfc" stroke-width="2" />
  <line class="axis" x1="106.0" y1="124.2" x2="106.0" y2="181.7" style="stroke:#3c3f47;stroke-width:1.2" />
  <path d="M102.0,129.17142857142855 L106.0,124.17142857142855 L110.0,129.17142857142855" fill="none" stroke="#3c3f47" stroke-width="1.2" />
  <path d="M102.0,176.74285714285713 L106.0,181.74285714285713 L110.0,176.74285714285713" fill="none" stroke="#3c3f47" stroke-width="1.2" />
  <text class="val halo" x="116.0" y="151.0">about 13 points</text>
  <text class="sub" x="227.0" y="236.2" text-anchor="middle">Hardened: 1 point above the dotted line on average</text>
  <text class="val" x="426.0" y="70.3">Clean</text>
  <text class="sub" x="426.0" y="87.3">graded by its original tests</text>
  <text class="val" x="426.0" y="157.1">Hardened</text>
  <text class="sub" x="426.0" y="174.1">trained with the new tests</text>
  <line class="axis" x1="383.0" y1="178.8" x2="420.0" y2="194.1" />
  <text class="val" x="426.0" y="199.1">Clean's patches</text>
  <text class="sub" x="426.0" y="216.1">re-graded with the new tests</text>
</svg>
